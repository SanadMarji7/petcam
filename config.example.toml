# Petcam configuration.
# Easiest: run `python3 setup.py`, which writes config.toml for you.
# Manual: copy this file to config.toml and fill in the three values below.
# Generate a key with: python3 -c "import secrets; print(secrets.token_urlsafe(32))"

# Tailscale MagicDNS name of this server. Browsers must open exactly this host;
# the server rejects WebSocket connections from any other origin.
hostname = "dogcam.your-tailnet.ts.net"

# Secret pairing keys, at least 32 characters each and different from each other.
publisher_key = "CHANGE_ME_TO_A_RANDOM_32_CHAR_PUBLISHER_KEY"
viewer_key = "CHANGE_ME_TO_A_RANDOM_32_CHAR_VIEWER_KEY"

# How many phones/laptops may watch at the same time.
max_viewers = 4

# Also offer Google STUN to the browsers. Keep true unless you want media to
# travel only over Tailscale IPs (then set false).
stun_enabled = true

# Local port for Uvicorn; `tailscale serve` forwards HTTPS to it.
port = 8000
